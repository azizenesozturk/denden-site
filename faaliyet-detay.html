<script>
  const menuAcBtn = document.getElementById('menuAcBtn');
  const menuKapatBtn = document.getElementById('menuKapatBtn');
  const mobilMenu = document.getElementById('mobilMenu');

  menuAcBtn.addEventListener('click', () => {
    mobilMenu.classList.remove('hidden');
    mobilMenu.classList.add('flex');
  });

  menuKapatBtn.addEventListener('click', () => {
    mobilMenu.classList.add('hidden');
    mobilMenu.classList.remove('flex');
  });


  // URL'DEN FAALİYET ID'SİNİ AL
  const urlParams = new URLSearchParams(window.location.search);
  const faaliyetId = urlParams.get('id');

  fetch('data/faaliyetler.json')
    .then(response => response.json())
    .then(faaliyetler => {
      const f = faaliyetler.find(item => item.id === faaliyetId);
      const container = document.getElementById('faaliyetIcerik');

      if (!f) {
        container.innerHTML = '<p class="text-text">Faaliyet bulunamadı.</p>';
        return;
      }

      const zorlukRenk = f.zorluk === 'Kolay' ? 'bg-kolay text-bg' 
                        : f.zorluk === 'Zor' ? 'bg-zor text-white' 
                        : 'bg-orta text-bg';

      const ETIKET_META = {
        'kamp':     { ad: 'Kamp',     renk: '#7BA7AF', textRenk: '#172525', icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-3.5 h-3.5"><path d="M5 19h4v-2h2v2h2v-2h2v2h4v-2h2v2h2v2H1v-2h2v-2h2v2Zm2-2H5v-3h2v3Zm6 0h-2v-2h2v2Zm6 0h-2v-3h2v3ZM9 14H7v-3h2v3Zm8 0h-2v-3h2v3Zm-6-3H9V8h2v3Zm4 0h-2V8h2v3Zm-2-3h-2V5h2v3Zm-2-3H9V3h2v2Zm4 0h-2V3h2v2Z"/></svg>` },
        'yürüyüş':  { ad: 'Yürüyüş',  renk: '#7BA7AF', textRenk: '#172525', icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-3.5 h-3.5"><path d="M18 23H10V21H12V19H14V21H16V17H18V23ZM10 15H12V19H10V17H6V15H8V13H4V11H10V15ZM20 17H18V15H20V17ZM14 15H12V13H14V15ZM22 15H20V13H18V11H20V7H22V15ZM4 7H8V9H4V11H2V3H4V7ZM18 11H16V9H18V11ZM16 9H14V3H16V9ZM12 7H10V5H12V7ZM14 3H4V1H14V3Z"/></svg>` },
        'yüzme':    { ad: 'Yüzme',    renk: '#7BA7AF', textRenk: '#172525', icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-3.5 h-3.5"><path d="M18 19h-6v-2h6v2ZM4 9h2v2H4v2h2v2H4v2H2V7h2v2Zm8 8h-2v-2h2v2Zm8 0h-2v-2h2v2Zm-10-2H8v-2h2v2Zm12 0h-2V9h2v6ZM8 13H6v-2h2v2Zm9-1h-2v-2h2v2Zm-7-1H8V9h2v2Zm2-2h-2V7h2v2Zm8 0h-2V7h2v2Zm-2-2h-6V5h6v2Z"/></svg>` },
        'mangal':   { ad: 'Mangal',   renk: '#7BA7AF', textRenk: '#172525', icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-3.5 h-3.5"><path d="M13 16h2v4h2v2H7v-2h2v-4h2v-2h2v2Zm-6 4H5v-2h2v2Zm12 0h-2v-2h2v2ZM5 18H3v-8h2v8Zm16 0h-2v-6h2v6Zm-6-6h-2v-2h2v2Zm4 0h-2v-2h2v2ZM7 10H5V8h2v2Zm6 0h-2V6h2v4Zm4 0h-2V8h2v2ZM9 8H7V6h2v2Zm2-2H9V2h2v4Z"/></svg>` }
      };
      const anaEtiket = (f.etiketler && f.etiketler[0]) || '';
      const etiketMeta = ETIKET_META[anaEtiket];

      const alevIkon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="inline -mt-0.5 mr-1"><path d="M12 2c1 3-2 4-2 7a3 3 0 0 0 6 0c0-2-1-3-1-3 2 1 3 4 3 6a6 6 0 0 1-12 0c0-4 3-6 3-10 1 1 2 2 3 0Z"/></svg>`;

      // Fotoğraf galerisi — DÜŞEY (alt alta), açıklama alanı ile
      const galeriHTML = (f.fotograflar || []).map(foto => {
        const url = typeof foto === 'string' ? foto : foto.url;
        const aciklama = typeof foto === 'string' ? '' : (foto.aciklama || '');
        return `
          <div class="mb-6">
            <img src="${url}" class="w-full rounded-xl" onerror="this.style.display='none'">
            ${aciklama ? `<p class="text-text/70 text-sm mt-2 italic">${aciklama}</p>` : ''}
          </div>
        `;
      }).join('');

      // "İlgileniyorum" butonu — sadece son başvuru tarihi geçmemişse görünür
      const bugun = new Date();
      const sonTarih = f.sonBasvuruTarihi ? new Date(f.sonBasvuruTarihi) : null;
      const butonGoster = sonTarih && bugun <= sonTarih;

      const butonHTML = butonGoster ? `
        <a href="iletisim.html?konu=${encodeURIComponent(f.rota)}" class="inline-block bg-accent text-white font-semibold px-6 py-3 rounded-lg hover:opacity-90 transition">
          İlgileniyorum →
        </a>
      ` : '';

      

      container.innerHTML = `
        <div class="h-72 bg-bg/50 rounded-xl mb-4 overflow-hidden">
          <img src="${f.kapak}" class="w-full h-full object-cover" style="object-position: center 65%;" onerror="this.style.display='none'">
        </div>

        <div class="flex items-start justify-between gap-3 mb-6">
          <h1 class="text-heading text-3xl font-bold">${f.rota}</h1>
          ${etiketMeta ? `<span style="background-color:${etiketMeta.renk};color:${etiketMeta.textRenk}" class="text-xs font-semibold px-3 py-1 rounded-full shrink-0 flex items-center gap-1 mt-1">${etiketMeta.icon}${etiketMeta.ad}</span>` : ''}
        </div>

        ${f.detaylar ? `
          <div class="bg-card rounded-xl p-5 mb-6 border-l-4 border-accent">
            <h3 class="text-heading text-lg font-bold mb-2">Detaylar</h3>
            <p class="text-text leading-relaxed">${f.detaylar}</p>
          </div>
        ` : ''}

        <h3 class="text-heading text-lg font-bold mb-3">Gezi Bilgileri</h3>
        <div class="grid grid-cols-2 gap-2 sm:gap-4 mb-8">

          <!-- TARİH -->
          <div class="bg-card rounded-xl p-2.5 sm:p-4 flex items-start gap-2 sm:gap-3 min-h-[68px] sm:min-h-[76px]">
            <svg class="text-highlight shrink-0 mt-1 w-4 h-4 sm:w-[22px] sm:h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M19 22H5v-2h14v2ZM5 8h14V6h2v14h-2V10H5v10H3V6h2v2Zm4 10H7v-2h2v2Zm4 0h-2v-2h2v2Zm-4-4H7v-2h2v2Zm4 0h-2v-2h2v2Zm4 0h-2v-2h2v2ZM9 4h6V2h2v2h2v2H5V4h2V2h2v2Z"/></svg>
            <div class="min-w-0">
              <p class="text-heading text-xs sm:text-sm font-semibold truncate">Tarih</p>
              <p class="text-text text-xs sm:text-sm break-words">${f.tarih}</p>
            </div>
          </div>

          <!-- BÖLGE -->
          <div class="bg-card rounded-xl p-2.5 sm:p-4 flex items-start gap-2 sm:gap-3 min-h-[68px] sm:min-h-[76px]">
            <svg class="text-highlight shrink-0 mt-1 w-4 h-4 sm:w-[22px] sm:h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M13 23h-2v-2h2v2Zm-2-2H9v-2h2v2Zm4 0h-2v-2h2v2Zm-6-2H7v-2h2v2Zm8 0h-2v-2h2v2ZM7 17H5v-3h2v3Zm12 0h-2v-3h2v3ZM5 14H3V6h2v8Zm9 0h-4v-2h4v2Zm7 0h-2V6h2v8Zm-11-2H8V8h2v4Zm6 0h-2V8h2v4Zm-2-4h-4V6h4v2ZM7 6H5V4h2v2Zm12 0h-2V4h2v2Zm-2-2H7V2h10v2Z"/></svg>
            <div class="min-w-0">
              <p class="text-heading text-xs sm:text-sm font-semibold truncate">Bölge</p>
              <p class="text-text text-xs sm:text-sm break-words">${f.bolge}</p>
            </div>
          </div>

          <!-- HAVA -->
          <div class="bg-card rounded-xl p-2.5 sm:p-4 flex items-start gap-2 sm:gap-3 min-h-[68px] sm:min-h-[76px]">
            <svg class="text-highlight shrink-0 mt-1 w-4 h-4 sm:w-[22px] sm:h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M22 20H2v-2h20v2ZM2 18H0v-6h2v6Zm22 0h-2v-6h2v6Zm-6-6v2h-2v-2h2ZM4 12H2v-2h2v2Zm6 0H8v-2h2v2Zm10-2h2v2h-4V8h2v2ZM8 10H4V8h4v2Zm2-2H8V6h2v2Zm8 0h-2V6h2v2Zm-2-2h-6V4h6v2Z"/></svg>
            <div class="min-w-0">
              <p class="text-heading text-xs sm:text-sm font-semibold truncate">Hava</p>
              <p class="text-text text-xs sm:text-sm break-words">${f.havaDurumu}</p>
            </div>
          </div>

          <!-- EKİPMAN -->
          <div class="bg-card rounded-xl p-2.5 sm:p-4 flex items-start gap-2 sm:gap-3 min-h-[68px] sm:min-h-[76px]">
            <svg class="text-highlight shrink-0 mt-1 w-4 h-4 sm:w-[22px] sm:h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M21 22H3v-2h18v2ZM3 20H1v-6h2v6Zm20 0h-2v-6h2v6ZM9 7h6V4h2v3h2v2h-2v2h-2V9H9v2H7V9H5v5H3V9h2V7h2V4h2v3Zm12 7h-2V9h2v5ZM15 4H9V2h6v2Z"/></svg>
            <div class="min-w-0">
              <p class="text-heading text-xs sm:text-sm font-semibold truncate">Ekipman</p>
              <p class="text-text text-xs sm:text-sm break-words">${f.ekipman.join(', ')}</p>
            </div>
          </div>

          <!-- EKİP -->
          <div class="bg-card rounded-xl p-2.5 sm:p-4 flex items-start gap-2 sm:gap-3 min-h-[68px] sm:min-h-[76px]">
            <svg class="text-highlight shrink-0 mt-1 w-4 h-4 sm:w-[22px] sm:h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22H0v-4h2v4Zm14 0h-2v-4h2v4Zm8 0h-2v-4h2v4ZM4 18H2v-2h2v2Zm10 0h-2v-2h2v2Zm8 0h-2v-2h2v2Zm-10-2H4v-2h8v2Zm8 0h-4v-2h4v2Zm-9-4H5v-2h6v2Zm8 0h-4v-2h4v2ZM5 10H3V4h2v6Zm8 0h-2V4h2v6Zm8 0h-2V4h2v6ZM11 4H5V2h6v2Zm8 0h-4V2h4v2Z"/></svg>
            <div class="min-w-0">
              <p class="text-heading text-xs sm:text-sm font-semibold truncate">Ekip</p>
              <p class="text-text text-xs sm:text-sm break-words">${f.ekip.join(', ')}</p>
            </div>
          </div>

          <!-- SAAT -->
          <div class="bg-card rounded-xl p-2.5 sm:p-4 flex items-start gap-2 sm:gap-3 min-h-[68px] sm:min-h-[76px]">
            <svg class="text-highlight shrink-0 mt-1 w-4 h-4 sm:w-[22px] sm:h-[22px]" viewBox="0 0 24 24" fill="currentColor"><path d="M18 22H6v-2h12v2ZM6 20H4v-2h2v2Zm14 0h-2v-2h2v2ZM4 18H2V6h2v12Zm18 0h-2V6h2v12Zm-5-1h-2v-2h2v2Zm-2-2h-2v-2h2v2Zm-2-2h-2V6h2v7ZM6 6H4V4h2v2Zm14 0h-2V4h2v2Zm-2-2H6V2h12v2Z"/></svg>
            <div class="min-w-0">
