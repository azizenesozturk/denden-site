<script>
  const menuAcBtn = document.getElementById('menuAcBtn');
  const menuKapatBtn = document.getElementById('menuKapatBtn');
  const mobilMenu = document.getElementById('mobilMenu');

  menuAcBtn.addEventListener('click', () => {
    mobilMenu.classList.remove('hidden');
    mobilMenu.classList.add('flex');
  });

  menuKapatBtn.addEventListener('click', () => {
    mobilMenu.classList.add('hidden');
    mobilMenu.classList.remove('flex');
  });

// FAALİYETLERİ JSON'DAN ÇEK, ETİKETE GÖRE FİLTRELE VE GÖSTER
  let tumFaaliyetler = [];
  let aktifEtiket = '';

  const ETIKET_META = {
  'kamp':     { ad: 'Kamp',     renk: '#7BA7AF', textRenk: '#172525', icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-3.5 h-3.5"><path d="M5 19h4v-2h2v2h2v-2h2v2h4v-2h2v2h2v2H1v-2h2v-2h2v2Zm2-2H5v-3h2v3Zm6 0h-2v-2h2v2Zm6 0h-2v-3h2v3ZM9 14H7v-3h2v3Zm8 0h-2v-3h2v3Zm-6-3H9V8h2v3Zm4 0h-2V8h2v3Zm-2-3h-2V5h2v3Zm-2-3H9V3h2v2Zm4 0h-2V3h2v2Z"/></svg>` },
  'yürüyüş':  { ad: 'Yürüyüş',  renk: '#7BA7AF', textRenk: '#172525', icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-3.5 h-3.5"><path d="M18 23H10V21H12V19H14V21H16V17H18V23ZM10 15H12V19H10V17H6V15H8V13H4V11H10V15ZM20 17H18V15H20V17ZM14 15H12V13H14V15ZM22 15H20V13H18V11H20V7H22V15ZM4 7H8V9H4V11H2V3H4V7ZM18 11H16V9H18V11ZM16 9H14V3H16V9ZM12 7H10V5H12V7ZM14 3H4V1H14V3Z"/></svg>` },
  'yüzme':    { ad: 'Yüzme',    renk: '#7BA7AF', textRenk: '#172525', icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-3.5 h-3.5"><path d="M18 19h-6v-2h6v2ZM4 9h2v2H4v2h2v2H4v2H2V7h2v2Zm8 8h-2v-2h2v2Zm8 0h-2v-2h2v2Zm-10-2H8v-2h2v2Zm12 0h-2V9h2v6ZM8 13H6v-2h2v2Zm9-1h-2v-2h2v2Zm-7-1H8V9h2v2Zm2-2h-2V7h2v2Zm8 0h-2V7h2v2Zm-2-2h-6V5h6v2Z"/></svg>` },
  'mangal':   { ad: 'Mangal',   renk: '#7BA7AF', textRenk: '#172525', icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-3.5 h-3.5"><path d="M13 16h2v4h2v2H7v-2h2v-4h2v-2h2v2Zm-6 4H5v-2h2v2Zm12 0h-2v-2h2v2ZM5 18H3v-8h2v8Zm16 0h-2v-6h2v6Zm-6-6h-2v-2h2v2Zm4 0h-2v-2h2v2ZM7 10H5V8h2v2Zm6 0h-2V6h2v4Zm4 0h-2V8h2v2ZM9 8H7V6h2v2Zm2-2H9V2h2v4Z"/></svg>` }
};

function kartCiz(f) {
  const anaEtiket = (f.etiketler && f.etiketler[0]) || '';
  const meta = ETIKET_META[anaEtiket];

  const kart = document.createElement('a');
    kart.href = `faaliyet-detay.html?id=${f.id}`;
    kart.className = 'bg-card rounded-xl overflow-hidden hover:bg-card/70 transition flex flex-row h-36 sm:h-52';
    kart.innerHTML = `
      <div class="w-1/3 flex-shrink-0 h-full bg-bg/50">
        <img src="${f.kapak}" alt="${f.rota}" class="w-full h-full object-cover" onerror="this.style.display='none'">
      </div>
      <div class="px-3 py-1 sm:p-5 flex-1 min-w-0 flex flex-col justify-center">
        <div class="flex items-center justify-between gap-2 mb-1">
          <h3 class="text-heading text-sm sm:text-lg font-bold leading-snug min-w-0 line-clamp-2">${f.rota}</h3>
          ${meta ? `<span style="background-color:${meta.renk};color:${meta.textRenk}" class="text-[9px] sm:text-xs font-semibold px-2 sm:px-3 py-0.5 sm:py-1 rounded-full shrink-0 flex items-center gap-1">${meta.icon}${meta.ad}</span>` : ''}
        </div>
      <div class="flex flex-nowrap items-center gap-x-1.5 text-highlight text-[9px] sm:text-sm mb-2 overflow-hidden">
        <span class="flex items-center gap-1 whitespace-nowrap">
          <svg width="12" height="12" class="shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M13 23h-2v-2h2v2Zm-2-2H9v-2h2v2Zm4 0h-2v-2h2v2Zm-6-2H7v-2h2v2Zm8 0h-2v-2h2v2ZM7 17H5v-3h2v3Zm12 0h-2v-3h2v3ZM5 14H3V6h2v8Zm9 0h-4v-2h4v2Zm7 0h-2V6h2v8Zm-11-2H8V8h2v4Zm6 0h-2V8h2v4Zm-2-4h-4V6h4v2ZM7 6H5V4h2v2Zm12 0h-2V4h2v2Zm-2-2H7V2h10v2Z"/></svg>
          ${f.bolge}
        </span>
        <span class="flex items-center gap-1 whitespace-nowrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 22H5v-2h14v2ZM5 8h14V6h2v14h-2V10H5v10H3V6h2v2Zm4 10H7v-2h2v2Zm4 0h-2v-2h2v2Zm-4-4H7v-2h2v2Zm4 0h-2v-2h2v2Zm4 0h-2v-2h2v2ZM9 4h6V2h2v2h2v2H5V4h2V2h2v2Z"/></svg>
          ${f.tarih}
        </span>
        ${f.saat ? `
        <span class="flex items-center gap-1 whitespace-nowrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18 22H6v-2h12v2ZM6 20H4v-2h2v2Zm14 0h-2v-2h2v2ZM4 18H2V6h2v12Zm18 0h-2V6h2v12Zm-5-1h-2v-2h2v2Zm-2-2h-2v-2h2v2Zm-2-2h-2V6h2v7ZM6 6H4V4h2v2Zm14 0h-2V4h2v2Zm-2-2H6V2h12v2Z"/></svg>
          ${f.saat}
        </span>
        ` : ''}
      </div>
      ${f.detaylar ? `<p class="text-text text-[11px] sm:text-sm mb-2 sm:mb-3 line-clamp-2 sm:line-clamp-none">${f.detaylar.substring(0, 90)}${f.detaylar.length > 90 ? '...' : ''}</p>` : ''}
      <span class="text-accent text-xs sm:text-sm font-semibold">Devamını Oku →</span>
    </div>
  `;
  return kart;
}

  function grideCiz(liste) {
    const grid = document.getElementById('faaliyetGrid');
    grid.innerHTML = '';

    if (liste.length === 0) {
      grid.innerHTML = '<p class="text-text col-span-full text-center py-10">Bu etikete uygun faaliyet bulunamadı.</p>';
      return;
    }

    liste.forEach(f => grid.appendChild(kartCiz(f)));
  }

  function etiketButonlariniGuncelle() {
  document.querySelectorAll('.etiketBtn').forEach(btn => {
    const kendiEtiketi = btn.dataset.etiket;
    if (kendiEtiketi === aktifEtiket) {
      btn.style.backgroundColor = '#7BA7AF';
      btn.style.color = '#172525';
      btn.classList.remove('bg-bg/60', 'text-text', 'hover:bg-bg/80');
    } else {
      btn.style.backgroundColor = '';
      btn.style.color = '';
      btn.classList.add('bg-bg/60', 'text-text', 'hover:bg-bg/80');
    }
  });
}

  function filtreUygula() {
    const filtreli = !aktifEtiket
      ? tumFaaliyetler
      : tumFaaliyetler.filter(f => (f.etiketler || []).includes(aktifEtiket));

    grideCiz(filtreli);
    etiketButonlariniGuncelle();
  }

  fetch('data/faaliyetler.json')
    .then(response => response.json())
    .then(faaliyetler => {
      faaliyetler.sort((a, b) => new Date(b.tarih) - new Date(a.tarih));
      tumFaaliyetler = faaliyetler;

      grideCiz(tumFaaliyetler);

      document.querySelectorAll('.etiketBtn').forEach(btn => {
        btn.addEventListener('click', () => {
          const secilen = btn.dataset.etiket;
          aktifEtiket = (aktifEtiket === secilen) ? '' : secilen;
          filtreUygula();
        });
      });
    })
    .catch(err => console.error('Faaliyetler yüklenemedi:', err));

</script>

</body>
</html>
