<script>
  const menuAcBtn = document.getElementById('menuAcBtn');
  const menuKapatBtn = document.getElementById('menuKapatBtn');
  const mobilMenu = document.getElementById('mobilMenu');

  menuAcBtn.addEventListener('click', () => {
    mobilMenu.classList.remove('hidden');
    mobilMenu.classList.add('flex');
  });

  menuKapatBtn.addEventListener('click', () => {
    mobilMenu.classList.add('hidden');
    mobilMenu.classList.remove('flex');
  });

// URL'DEN BLOG ID'SİNİ AL
  const blogUrlParams = new URLSearchParams(window.location.search);
  const blogId = blogUrlParams.get('id');

  fetch('data/blog.json')
    .then(response => response.json())
    .then(yazilar => {
      const b = yazilar.find(item => item.id === blogId);
      const container = document.getElementById('blogIcerik');

      if (!b) {
        container.innerHTML = '<p class="text-text">Yazı bulunamadı.</p>';
        return;
      }

      // Markdown içeriği HTML'e çevir
      const icerikHTML = marked.parse(b.icerik);

      container.innerHTML = `
        <div class="h-72 bg-bg/50 rounded-xl mb-6 overflow-hidden">
          <img src="${b.kapak}" class="w-full h-full object-cover" onerror="this.style.display='none'">
        </div>

        <h1 class="text-heading text-3xl font-bold mt-2 mb-2">${b.baslik}</h1>
        <p class="text-highlight text-sm mb-8 flex items-center gap-2">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 22H5v-2h14v2ZM5 8h14V6h2v14h-2V10H5v10H3V6h2v2Zm4 10H7v-2h2v2Zm4 0h-2v-2h2v2Zm-4-4H7v-2h2v2Zm4 0h-2v-2h2v2Zm4 0h-2v-2h2v2ZM9 4h6V2h2v2h2v2H5V4h2V2h2v2Z"/></svg>
          ${b.tarih}
        </p>

        <div class="prose-blog text-text leading-relaxed">
          ${icerikHTML}
        </div>
      `;

      // İÇİNDEKİLER (## başlıklarından otomatik)
      const basliklar = [...container.querySelectorAll('.prose-blog h2')];
      if (basliklar.length > 1) {
        const icindekilerKutu = document.getElementById('icindekiler');
        let liste = '<h3 class="text-heading font-bold mb-3">İçindekiler</h3><ul class="space-y-1">';
        basliklar.forEach((h, i) => {
          const ankor = 'baslik-' + i;
          h.id = ankor;
          liste += `<li><a href="#${ankor}" class="text-accent text-sm hover:underline">${h.textContent}</a></li>`;
        });
        liste += '</ul>';
        icindekilerKutu.innerHTML = liste;
        icindekilerKutu.classList.remove('hidden');
      }

      // TEPKİ SİSTEMİ (Sadece bir emoji seçilebilir)
      const tepkiler = ['😭', '😲', '😠', '😄', '👍', '🏔️'];
      const secimKey = 'tepkiSecim_' + b.id;
      const secilenEmoji = localStorage.getItem(secimKey);
      const tepkiKutusu = document.getElementById('tepkiKutusu');

      function tepkileriCiz() {
        tepkiKutusu.innerHTML = tepkiler.map(emoji => {
          const sayiKey = 'tepkiSayi_' + b.id + '_' + emoji;
          const sayi = parseInt(localStorage.getItem(sayiKey)) || 0;
          const secilmisMi = localStorage.getItem(secimKey) === emoji;
          return `<button class="tepkiBtn ${secilmisMi ? 'bg-accent text-white' : 'bg-card text-text'} hover:opacity-80 transition rounded-lg px-3 py-2 text-sm" data-emoji="${emoji}">${emoji} <span>${sayi}</span></button>`;
        }).join('');

        tepkiKutusu.querySelectorAll('.tepkiBtn').forEach(btn => {
          btn.addEventListener('click', () => {
            const yeniEmoji = btn.dataset.emoji;
            const oncekiSecim = localStorage.getItem(secimKey);

            if (oncekiSecim === yeniEmoji) return; // zaten bu seçiliyse tekrar tıklamayı yoksay

            // Önceki seçimin sayacını azalt
            if (oncekiSecim) {
              const oncekiSayiKey = 'tepkiSayi_' + b.id + '_' + oncekiSecim;
              let oncekiSayi = parseInt(localStorage.getItem(oncekiSayiKey)) || 0;
              oncekiSayi = Math.max(0, oncekiSayi - 1);
              localStorage.setItem(oncekiSayiKey, oncekiSayi);
            }

            // Yeni seçimin sayacını artır
            const yeniSayiKey = 'tepkiSayi_' + b.id + '_' + yeniEmoji;
            let yeniSayi = parseInt(localStorage.getItem(yeniSayiKey)) || 0;
            yeniSayi++;
            localStorage.setItem(yeniSayiKey, yeniSayi);

            localStorage.setItem(secimKey, yeniEmoji);
            tepkileriCiz();
          });
        });
      }

      tepkileriCiz();

      // ÖNCEKİ / SONRAKİ YAZI
      fetch('data/blog.json').then(r => r.json()).then(yazilar => {
        const siraliYazilar = [...yazilar].sort((a, b) => new Date(a.tarih) - new Date(b.tarih));
        const suankiIndex = siraliYazilar.findIndex(y => y.id === b.id);
        const oncekiYazi = siraliYazilar[suankiIndex - 1];
        const sonrakiYazi = siraliYazilar[suankiIndex + 1];

        const kutu = document.getElementById('oncekiSonrakiYazi');
        let html = '';

        if (oncekiYazi) {
          html += `
            <a href="blog-detay.html?id=${oncekiYazi.id}" class="bg-card border border-highlight rounded-xl p-4 hover:bg-card/70 transition">
              <span class="text-accent text-xs font-semibold">← Önceki Yazı</span>
              <p class="text-text text-sm mt-1">${oncekiYazi.baslik}</p>
            </a>
          `;
        } else {
          html += '<div></div>';
        }

        if (sonrakiYazi) {
          html += `
            <a href="blog-detay.html?id=${sonrakiYazi.id}" class="bg-card border border-highlight rounded-xl p-4 hover:bg-card/70 transition text-right">
              <span class="text-accent text-xs font-semibold">Sonraki Yazı →</span>
              <p class="text-text text-sm mt-1">${sonrakiYazi.baslik}</p>
            </a>
          `;
        } else {
          html += '<div></div>';
        }

        kutu.innerHTML = html;
      });

      
    })
    .catch(err => console.error('Yazı yüklenemedi:', err));


    // OKUMA İLERLEME ÇUBUĞU
  window.addEventListener('scroll', () => {
    const yukseklik = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const ilerleme = (window.scrollY / yukseklik) * 100;
    document.getElementById('okumaCubugu').style.width = ilerleme + '%';
  });

</script>
